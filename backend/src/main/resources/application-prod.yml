spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

panther:
  seed:
    enabled: ${PANTHER_SEED_ENABLED:false}

logging:
  level:
    com.panther.pms: INFO
